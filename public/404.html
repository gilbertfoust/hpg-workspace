<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HPG Workstation</title>
    <script>
      // GitHub Pages SPA fallback. Redirect to the project root and carry the
      // requested route in one encoded query parameter. index.html restores
      // the route before React mounts.
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var pathParts = path.split('/').filter(function(p) { return p; });
      var project = pathParts.shift();
      var base = project ? '/' + project + '/' : '/';
      var route = '/' + pathParts.join('/');

      if (!path.includes('index.html')) {
        window.location.replace(
          base + '?spa_redirect=' + encodeURIComponent(route + search + hash)
        );
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>Please enable JavaScript to use this application.</p>
    </noscript>
  </body>
</html>
