name: Learning Academy validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/LearningAcademy.tsx'
      - 'src/data/academyCoreTracks.ts'
      - 'src/components/onboarding/AcademyScreenGuide.tsx'
      - 'src/pages/AcademyPracticeLab.tsx'
      - 'src/pages/AcademyRecordingStudio.tsx'
      - 'src/pages/AcademyReadinessCenter.tsx'
      - 'src/pages/WorkspaceResearchLibrary.tsx'
      - 'src/hooks/useWorkspaceResearchLibrary.ts'
      - 'src/hooks/useAcademyReadiness.ts'
      - 'src/data/academyWorkspaceTracks.ts'
      - 'src/components/onboarding/AcademyNarratedSteps.tsx'
      - 'src/components/onboarding/AcademyLessonResources.tsx'
      - 'src/hooks/useAcademyLessonResources.ts'
      - 'scripts/validate-academy-curriculum.mjs'
      - 'src/pages/AcademyTeamProgress.tsx'
      - 'src/pages/AcademyAssessments.tsx'
      - 'src/pages/BoardHub.tsx'
      - 'src/hooks/useAcademyAssessments.ts'
      - 'src/hooks/useBoardMeetings.ts'
      - 'src/components/onboarding/AcademySupervisorReview.tsx'
      - 'src/hooks/useAcademyProgress.ts'
      - 'src/pages/ContentStudio.tsx'
      - 'src/pages/EditorialDesk.tsx'
      - 'src/pages/DepartmentOperationsHub.tsx'
      - 'src/pages/CanonicalMagazinePanel.tsx'
      - 'src/components/onboarding/GuidedWalkthrough.tsx'
      - 'src/hooks/useDepartmentOperations.ts'
      - 'src/pages/EditorialMediaDesk.tsx'
      - 'src/pages/Publications.tsx'
      - 'src/hooks/useEditorialAssets.ts'
      - 'src/hooks/usePublications.ts'
      - 'src/hooks/useEditorial.ts'
      - 'src/pages/editorial-print.css'
      - 'src/App.tsx'
      - 'src/lib/accessControl.ts'
      - 'src/components/layout/AppSidebar.tsx'
      - 'src/components/layout/MainLayout.tsx'
      - '.github/workflows/academy-validation.yml'
  workflow_dispatch:

jobs:
  typecheck-and-feature-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify Academy lessons, workflow routes, private simulation and media authoring
        run: node scripts/validate-academy-curriculum.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint new learning and studio pages
        run: npx eslint src/pages/LearningAcademy.tsx src/data/academyCoreTracks.ts src/components/onboarding/AcademyScreenGuide.tsx src/pages/AcademyPracticeLab.tsx src/pages/AcademyRecordingStudio.tsx src/pages/AcademyReadinessCenter.tsx src/pages/WorkspaceResearchLibrary.tsx src/hooks/useWorkspaceResearchLibrary.ts src/hooks/useAcademyReadiness.ts src/data/academyWorkspaceTracks.ts src/components/onboarding/AcademyNarratedSteps.tsx src/components/onboarding/AcademyLessonResources.tsx src/hooks/useAcademyLessonResources.ts src/pages/AcademyTeamProgress.tsx src/pages/AcademyAssessments.tsx src/pages/BoardHub.tsx src/hooks/useAcademyAssessments.ts src/hooks/useBoardMeetings.ts src/components/onboarding/AcademySupervisorReview.tsx src/hooks/useAcademyProgress.ts src/pages/ContentStudio.tsx src/pages/DepartmentOperationsHub.tsx src/pages/CanonicalMagazinePanel.tsx src/components/onboarding/GuidedWalkthrough.tsx src/hooks/useDepartmentOperations.ts src/pages/EditorialDesk.tsx src/pages/EditorialMediaDesk.tsx src/pages/Publications.tsx src/hooks/useEditorial.ts src/hooks/useEditorialAssets.ts src/hooks/usePublications.ts
