name: Supabase Migration Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migration-validation.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect database migration and test changes
        id: database-scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual validation requested; the complete database replay will run."
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          printf '%s\n' "$CHANGED_FILES"

          if grep -Eq '^supabase/(migrations|tests)/|^supabase/config\.toml$' <<< "$CHANGED_FILES"; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
            echo "Database migrations, tests, or configuration changed; the complete replay will run."
          else
            echo "database_changed=false" >> "$GITHUB_OUTPUT"
            echo "No database migration, test, or configuration changes were detected."
          fi

      - name: Database replay not required
        if: steps.database-scope.outputs.database_changed != 'true'
        run: |
          echo "This pull request changes Edge Function or workflow code only."
          echo "The Edge Function validation job remains required; database replay is reserved for migration, SQL test, and Supabase configuration changes."

      - name: Set up Node
        if: steps.database-scope.outputs.database_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.database-scope.outputs.database_changed == 'true'
        run: npm ci

      - name: Start database-only Supabase stack
        if: steps.database-scope.outputs.database_changed == 'true'
        id: supabase-start
        shell: bash
        run: |
          set -o pipefail
          # Full application services are unnecessary for migration replay,
          # database smoke tests, and SQL linting. Keeping only Postgres makes
          # the validation job faster and more reliable on hosted runners.
          EXCLUDED_SERVICES="studio,imgproxy,mailpit,storage-api,realtime,edge-runtime,logflare,vector,supavisor,gotrue,kong,postgres-meta,postgrest"
          npx supabase start -x "$EXCLUDED_SERVICES" 2>&1 | tee supabase-start.log

      - name: Rebuild database from migrations
        if: steps.database-scope.outputs.database_changed == 'true'
        id: database-reset
        shell: bash
        run: |
          set -o pipefail
          npx supabase db reset --local 2>&1 | tee supabase-reset.log

      - name: Run Agent OS activation fee smoke test
        if: steps.database-scope.outputs.database_changed == 'true'
        id: activation-fee-smoke-test
        shell: bash
        run: |
          set -o pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/agent_os_activation_fee_smoke.sql \
            2>&1 | tee activation-fee-smoke.log

      - name: Run database lint
        if: steps.database-scope.outputs.database_changed == 'true'
        id: database-lint
        shell: bash
        run: |
          set -o pipefail
          npx supabase db lint --local --level warning 2>&1 | tee supabase-lint.log

      - name: Upload Supabase validation diagnostics
        if: always() && steps.database-scope.outputs.database_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-validation-diagnostics
          path: |
            supabase-start.log
            supabase-reset.log
            activation-fee-smoke.log
            supabase-lint.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show local service status
        if: always() && steps.database-scope.outputs.database_changed == 'true'
        run: npx supabase status || true

      - name: Stop local Supabase stack
        if: always() && steps.database-scope.outputs.database_changed == 'true'
        run: npx supabase stop --no-backup || true

  check-edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Agent OS workers
        id: deno-check
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Checking process-agent-os-communications"
            deno check supabase/functions/process-agent-os-communications/index.ts
            echo "Checking process-agent-os-trello-sync"
            deno check supabase/functions/process-agent-os-trello-sync/index.ts
            echo "Checking agent-os-external-form"
            deno check supabase/functions/agent-os-external-form/index.ts
          } 2>&1 | tee deno-check.log

      - name: Upload Deno diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-os-deno-diagnostics
          path: deno-check.log
          if-no-files-found: ignore
          retention-days: 7
