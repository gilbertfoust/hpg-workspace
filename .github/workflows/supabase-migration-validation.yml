name: Supabase Migration Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migration-validation.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Start minimal local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDED_SERVICES="studio,imgproxy,logflare,vector,supavisor,realtime,storage-api,edge-runtime,inbucket,pgadmin-schema-diff,migra"
          if ! npx supabase start -x "$EXCLUDED_SERVICES" > supabase-start.log 2>&1; then
            echo "Supabase start failed. Showing the final diagnostic lines:"
            tail -n 200 supabase-start.log
            exit 1
          fi
          tail -n 40 supabase-start.log

      - name: Rebuild database from migrations
        shell: bash
        run: |
          set -euo pipefail
          if ! npx supabase db reset --local > supabase-reset.log 2>&1; then
            echo "Migration rebuild failed. Showing the final diagnostic lines:"
            tail -n 250 supabase-reset.log
            exit 1
          fi
          tail -n 80 supabase-reset.log

      - name: Run database lint
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db lint --local --level warning

      - name: Show local service status
        if: always()
        run: npx supabase status || true

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup || true

  check-edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Agent OS communication worker
        run: deno check supabase/functions/process-agent-os-communications/index.ts
